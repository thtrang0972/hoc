<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cổng Tư Vấn Tâm Lý - Đang chuyển hướng...</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App (SPA) Router Fallback
      (function() {
        var path = window.location.pathname;
        var repoPrefix = path.startsWith('/hoc') ? '/hoc' : '';
        var cleanPath = path.slice(repoPrefix.length) || '/';
        var search = window.location.search ? '&' + window.location.search.slice(1) : '';
        var hash = window.location.hash || '';
        var destination = repoPrefix + '/?redirect=' + encodeURIComponent(cleanPath + search + hash);
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; color: #334155; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Đang kết nối đến Cổng Tư Vấn Tâm Lý...</h2>
      <p style="font-size: 0.875rem; color: #64748b;">Hệ thống đang mở trang bạn yêu cầu, vui lòng đợi trong giây lát.</p>
    </div>
  </body>
</html>
